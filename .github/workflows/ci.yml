name: Pruebas automaticas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: inventario_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inventario_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_NAME: inventario_test
      TEST_DB_NAME: inventario_test
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preparar tabla de pruebas
        run: |
          python -c "import psycopg2; c=psycopg2.connect(host='localhost', database='inventario_test', user='postgres', password='postgres'); c.autocommit=True; c.cursor().execute('CREATE TABLE IF NOT EXISTS productos (id SERIAL PRIMARY KEY, nombre VARCHAR(100) NOT NULL, categoria VARCHAR(100) NOT NULL, precio NUMERIC(10,2) NOT NULL, cantidad INTEGER NOT NULL)'); c.close()"

      - name: Ejecutar pruebas
        run: python -m pytest -v