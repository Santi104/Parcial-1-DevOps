<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar producto</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

    <header class="header">

        <div class="header-content">

            <h1>📦 Sistema de Inventario</h1>

            <p>Editar información del producto</p>

        </div>

    </header>


    <main class="container">

        <section class="card">

            <h2>✏️ Editar producto</h2>

            <form
                action="{{ url_for('editar_producto', id=producto[0]) }}"
                method="POST"
            >

                <div class="form-grid">

                    <div class="form-group">

                        <label for="nombre">
                            Nombre del producto
                        </label>

                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            value="{{ producto[1] }}"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="categoria">
                            Categoría
                        </label>

                        <input
                            type="text"
                            id="categoria"
                            name="categoria"
                            value="{{ producto[2] }}"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="precio">
                            Precio
                        </label>

                        <input
                            type="number"
                            id="precio"
                            name="precio"
                            value="{{ producto[3] }}"
                            step="0.01"
                            min="0"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="cantidad">
                            Cantidad
                        </label>

                        <input
                            type="number"
                            id="cantidad"
                            name="cantidad"
                            value="{{ producto[4] }}"
                            min="0"
                            required
                        >

                    </div>

                </div>


                <div class="form-actions">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Guardar cambios
                    </button>

                    <a
                        href="{{ url_for('inicio') }}"
                        class="btn"
                    >
                        Cancelar
                    </a>

                </div>

            </form>

        </section>

    </main>


    <footer class="footer">
        Sistema de Inventario · Flask + PostgreSQL
    </footer>

</body>

</html>
